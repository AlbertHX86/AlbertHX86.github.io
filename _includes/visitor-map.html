{%- assign vm = site.visitor_map -%}
{%- if vm.id and vm.id != "" -%}
<div class="visitor-map" style="max-width:420px;margin:1em 0">
{%- case vm.provider -%}
{%- when "clustrmaps" -%}
{%- if vm.style == "globe" %}
<script type="text/javascript" id="clstr_globe" src="//clustrmaps.com/globe.js?d={{ vm.id }}"></script>
{%- else %}
<script type="text/javascript" id="clustrmaps" src="//clustrmaps.com/map_v2.js?d={{ vm.id }}&amp;cl=ffffff&amp;w=a"></script>
{%- endif -%}
{%- else -%}
{%- if vm.style == "globe" %}
<script type="text/javascript" id="mmvst_globe" src="//mapmyvisitors.com/globe.js?d={{ vm.id }}"></script>
{%- else %}
<script type="text/javascript" id="mapmyvisitors" src="//mapmyvisitors.com/map.js?d={{ vm.id }}&amp;cl=ffffff&amp;w=a"></script>
{%- endif -%}
{%- endcase %}
</div>
{%- endif -%}
